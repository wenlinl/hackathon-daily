# Render Blueprint：把微信转发接收端部署成 Web 服务。
# 在 Render 控制台用 "Blueprint / New + / Blueprint" 导入本文件即可。
# 免费档会闲置休眠，回调可能有冷启动延迟；消息被拒后企微会重试，日常个人使用可接受。
services:
  - type: web
    name: hackathon-daily-wecom
    runtime: python
    plan: free
    rootDir: hackathon-daily
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:8000 --chdir src --timeout 60 wecom_receiver:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WECOM_CORP_ID
        value: wwe3b521cd4fb34616
      - key: WECOM_TOKEN
        value: FUbk2M12tcCtYiS1V0
      - key: WECOM_AES_KEY
        value: GvZU9W4PNFu9YucYSEiYTwVOmqL3u5Fu3GAdlWGuT9S
      - key: WECOM_KF_TOKEN
        value: 2fYmCR
      - key: WECOM_KF_AES_KEY
        value: uq2BInwAIHTayNdpcRGajPGUU5nXBN4y7juAEc1fkmB
      - key: WECOM_KF_SECRET
        value: zimlarXguD87O5mZo4_76MjCqYYF_i5N1sf12mC-JAo
      # 客服消息游标持久化页面（Notion，重启不丢，避免重复处理旧消息）
      - key: WECOM_KF_CURSOR_PAGE_ID
        value: 3c060e0b-0bbf-81cd-8b7b-d0b9f466e721
      # 图片（长截图）识别：火山方舟视觉模型
      - key: VISION_API_KEY
        sync: false
      - key: VISION_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: VISION_MODEL
        value: doubao-seed-2-1-turbo-260628
      # 以下在 Render 面板里手动填（sync: false 不会写进仓库）
      - key: NOTION_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
