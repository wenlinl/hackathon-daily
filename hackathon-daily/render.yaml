# Render Blueprint：把微信转发接收端部署成 Web 服务。
# 在 Render 控制台用 "Blueprint / New + / Blueprint" 导入本文件即可。
# 免费档会闲置休眠，回调可能有冷启动延迟；消息被拒后企微会重试，日常个人使用可接受。
services:
  - type: web
    name: hackathon-daily-wecom
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:8000 --timeout 60 wecom_receiver:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: WECOM_CORP_ID
        value: wwe3b521cd4fb34616
      - key: WECOM_TOKEN
        value: FUbk2M12tcCtYiS1V0
      - key: WECOM_AES_KEY
        value: GvZU9W4PNFu9YucYSEiYTwVOmqL3u5Fu3GAdlWGuT9S
      # 微信客服（个人微信一键转发）配置，开通后在 kf.weixin.qq.com 获取
      - key: WECOM_KF_TOKEN
        sync: false
      - key: WECOM_KF_AES_KEY
        sync: false
      - key: WECOM_KF_SECRET
        sync: false
      # 以下在 Render 面板里手动填（sync: false 不会写进仓库）
      - key: NOTION_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
