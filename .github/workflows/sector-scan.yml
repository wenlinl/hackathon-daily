name: sector-scan

on:
  schedule:
    # 北京时间每个交易日 16:00（15:00 收盘后）= UTC 08:00，周一至周五
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore sector scan state
        id: state
        uses: actions/cache/restore@v4
        with:
          path: stock-daily/data
          key: sector-scan-state-${{ github.run_id }}
          restore-keys: |
            sector-scan-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r stock-daily/requirements.txt

      - name: Run sector scan
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python stock-daily/src/sector_scan.py

      - name: Save sector scan state
        uses: actions/cache/save@v4
        with:
          path: stock-daily/data
          key: sector-scan-state-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          echo "## Sector Scan Run" >> "$GITHUB_STEP_SUMMARY"
          echo "See workflow logs for details." >> "$GITHUB_STEP_SUMMARY"
