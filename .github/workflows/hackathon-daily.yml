name: hackathon-daily

on:
  # 已切换为"只分析微信转发"模式：不再定时抓取。
  # 如需恢复自动抓取：加回 schedule，并在仓库 Variables 里设 ENABLE_DAILY_SCRAPE=true
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hackathon-daily/requirements.txt

      - name: Run daily hackathon collection
        if: ${{ vars.ENABLE_DAILY_SCRAPE == 'true' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VERIFY_LLM_API_KEY: ${{ secrets.VERIFY_LLM_API_KEY }}
          VERIFY_LLM_BASE_URL: ${{ secrets.VERIFY_LLM_BASE_URL }}
          VERIFY_LLM_MODEL: ${{ secrets.VERIFY_LLM_MODEL }}
          VERIFY_MAX_EVENTS: ${{ vars.VERIFY_MAX_EVENTS }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_SPACE_ID: ${{ secrets.FEISHU_WIKI_SPACE_ID }}
          FEISHU_WIKI_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_NODE_TOKEN }}
          FEISHU_BITABLE_TABLE_ID: ${{ secrets.FEISHU_BITABLE_TABLE_ID }}
        run: python hackathon-daily/src/collect.py

      - name: Commit archive updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hackathon-daily/data/archive.json
          git add hackathon-daily/manual/articles.json
          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "chore(hackathon-daily): update server-side archive"
            git pull --rebase origin main || true
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Hackathon Daily Run" >> "$GITHUB_STEP_SUMMARY"
          echo "See workflow logs for details." >> "$GITHUB_STEP_SUMMARY"
