name: hackathon-daily

on:
  schedule:
    # 北京时间每天 09:00 = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hackathon-daily/requirements.txt

      - name: Run daily hackathon collection
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python hackathon-daily/src/collect.py

      - name: Commit archive updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hackathon-daily/data/archive.json
          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "chore(hackathon-daily): update server-side archive"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Hackathon Daily Run" >> "$GITHUB_STEP_SUMMARY"
          echo "See workflow logs for details." >> "$GITHUB_STEP_SUMMARY"
