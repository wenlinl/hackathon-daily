name: hackathon-daily

on:
  schedule:
    # 北京时间每天 09:00 = UTC 01:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hackathon-daily/requirements.txt

      - name: Run daily hackathon collection
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python hackathon-daily/src/collect.py

      - name: Summary
        if: always()
        run: |
          echo "## Hackathon Daily Run" >> "$GITHUB_STEP_SUMMARY"
          echo "See workflow logs for details." >> "$GITHUB_STEP_SUMMARY"
