name: send-keys

on:
  workflow_dispatch:
    inputs:
      body:
        description: 邮件正文（API Key 列表，含用途说明）
        required: true
        type: string

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send email via SMTP
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          BODY: ${{ github.event.inputs.body }}
        run: |
          python3 - <<'PY'
          import html
          import os
          import smtplib
          import ssl
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          host = os.environ["SMTP_HOST"]
          port = int(os.environ.get("SMTP_PORT") or "465")
          user = os.environ["SMTP_USER"]
          password = os.environ["SMTP_PASSWORD"]
          to = os.environ.get("EMAIL_TO") or "aresleng@sina.com"
          body = os.environ.get("BODY") or ""
          if not host or not user or not password:
              raise SystemExit("SMTP 配置缺失")

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "API Keys 汇总（含用途说明）"
          msg["From"] = user
          msg["To"] = to
          msg.attach(MIMEText(body, "plain", "utf-8"))
          html_body = (
              "<div style='font-family:-apple-system,PingFang SC,Microsoft YaHei,sans-serif;"
              "line-height:1.7;font-size:14px;color:#1f2328'>"
              "<pre style='font-family:Menlo,Consolas,monospace;font-size:13px;"
              "white-space:pre-wrap'>" + html.escape(body) + "</pre></div>"
          )
          msg.attach(MIMEText(html_body, "html", "utf-8"))

          ctx = ssl.create_default_context()
          if port == 465:
              with smtplib.SMTP_SSL(host, port, timeout=30, context=ctx) as server:
                  server.login(user, password)
                  server.sendmail(user, [to], msg.as_string())
          else:
              with smtplib.SMTP(host, port, timeout=30) as server:
                  server.starttls(context=ctx)
                  server.login(user, password)
                  server.sendmail(user, [to], msg.as_string())
          print(f"[ok] sent to {to} via {host}:{port}")
          PY
